[project]
name = "chakravyuh-ai"
version = "2.0.0"
description = "World Model Cyber Defense with ST-GNN & RSSM K-Horizon Risk Prediction"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pyshark>=0.6.0",
    "torch>=2.0.0",
    "torch-geometric>=2.5.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    "joblib>=1.3.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
